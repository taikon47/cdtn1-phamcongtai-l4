name: L4 Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: projectl4
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectl4"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Maven Wrapper permission
        run: chmod +x ./mvnw

      - name: Run Tests
        run: ./mvnw -B clean test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/projectl4
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
